services:
  - type: web
    name: styleos-api-bb-te
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://bb-te.github.io,http://localhost:5173
      - key: PERSISTENCE_MODE
        value: file
      - key: ENABLE_UNAUTHENTICATED_MEMORY_SYNC
        value: "false"
